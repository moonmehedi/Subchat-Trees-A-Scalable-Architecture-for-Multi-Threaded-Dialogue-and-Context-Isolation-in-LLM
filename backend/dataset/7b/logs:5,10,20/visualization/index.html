<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaggle Serverless - Buffer Size Comparison</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        .kaggle-badge {
            background: #20BEFF;
            color: white;
            padding: 5px 15px;
            border-radius: 5px;
            display: inline-block;
            margin: 10px auto;
        }
        .serverless-badge {
            background: #10B981;
            color: white;
            padding: 5px 15px;
            border-radius: 5px;
            display: inline-block;
            margin: 10px;
        }
        .chart-container {
            position: relative;
            height: 400px;
            margin-bottom: 40px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Kaggle Serverless Buffer Size Comparison</h1>
        <p class="subtitle">Subchat Trees: Direct Python Imports - No Server Needed</p>
        <div style="text-align: center;">
            <span class="kaggle-badge">Tested on Kaggle GPUs</span>
            <span class="serverless-badge">Serverless Architecture</span>
        </div>
        
        <h2>📊 Context Isolation Metrics</h2>
        
        <div class="chart-container">
            <canvas id="accuracyChart"></canvas>
        </div>
        
        <div class="chart-container">
            <canvas id="precisionChart"></canvas>
        </div>
        
        <div class="chart-container">
            <canvas id="recallChart"></canvas>
        </div>
        
        <div class="chart-container">
            <canvas id="f1Chart"></canvas>
        </div>
        
        <div class="chart-container">
            <canvas id="pollutionChart"></canvas>
        </div>
        
        <h2>🔬 Topic Recall Scores (ROUGE/BLEU)</h2>
        
        <div class="chart-container"><canvas id="rouge1Chart"></canvas></div>
        <div class="chart-container"><canvas id="rougeLChart"></canvas></div>
        <div class="chart-container"><canvas id="bleuChart"></canvas></div>
    </div>
    
    <script>
        const bufferSizes = [5, 10, 20];
        const baselineAccuracy = [21.35922330097087, 39.80582524271845, 15.857605177993527];
        const systemAccuracy = [58.252427184466015, 46.27831715210356, 38.51132686084142];
        const baselinePrecision = [44.73304473304473, 71.47263450834879, 34.935064935064936];
        const systemPrecision = [83.96936396936397, 88.72294372294371, 80.72510822510822];
        const baselineRecall = [21.103896103896105, 39.61038961038961, 15.584415584415584];
        const systemRecall = [58.116883116883116, 46.103896103896105, 38.311688311688314];
        const baselineF1 = [24.327692509510694, 44.67504839401325, 18.72036693465265];
        const systemF1 = [62.91793974423843, 55.2056645515948, 45.56581887893958];
        const baselinePollution = [78.64077669902912, 60.19417475728155, 84.14239482200647];
        const systemPollution = [41.74757281553398, 53.72168284789643, 61.48867313915858];
        
        const chartOptions = {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { position: 'top' }
            },
            scales: {
                y: { beginAtZero: true }
            }
        };
        
        new Chart(document.getElementById('accuracyChart'), {
            type: 'line',
            data: {
                labels: bufferSizes,
                datasets: [{
                    label: 'Baseline Accuracy',
                    data: baselineAccuracy,
                    borderColor: 'rgb(255, 99, 132)',
                    backgroundColor: 'rgba(255, 99, 132, 0.2)',
                }, {
                    label: 'System Accuracy',
                    data: systemAccuracy,
                    borderColor: 'rgb(75, 192, 192)',
                    backgroundColor: 'rgba(75, 192, 192, 0.2)',
                }]
            },
            options: {
                ...chartOptions,
                plugins: {
                    ...chartOptions.plugins,
                    title: { display: true, text: 'Accuracy vs Buffer Size (%)' }
                }
            }
        });
        
        new Chart(document.getElementById('precisionChart'), {
            type: 'line',
            data: {
                labels: bufferSizes,
                datasets: [{
                    label: 'Baseline Precision',
                    data: baselinePrecision,
                    borderColor: 'rgb(255, 99, 132)',
                    backgroundColor: 'rgba(255, 99, 132, 0.2)',
                }, {
                    label: 'System Precision',
                    data: systemPrecision,
                    borderColor: 'rgb(75, 192, 192)',
                    backgroundColor: 'rgba(75, 192, 192, 0.2)',
                }]
            },
            options: {
                ...chartOptions,
                plugins: {
                    ...chartOptions.plugins,
                    title: { display: true, text: 'Precision vs Buffer Size (%)' }
                }
            }
        });
        
        new Chart(document.getElementById('recallChart'), {
            type: 'line',
            data: {
                labels: bufferSizes,
                datasets: [{
                    label: 'Baseline Recall',
                    data: baselineRecall,
                    borderColor: 'rgb(255, 99, 132)',
                    backgroundColor: 'rgba(255, 99, 132, 0.2)',
                }, {
                    label: 'System Recall',
                    data: systemRecall,
                    borderColor: 'rgb(75, 192, 192)',
                    backgroundColor: 'rgba(75, 192, 192, 0.2)',
                }]
            },
            options: {
                ...chartOptions,
                plugins: {
                    ...chartOptions.plugins,
                    title: { display: true, text: 'Recall vs Buffer Size (%)' }
                }
            }
        });
        
        new Chart(document.getElementById('f1Chart'), {
            type: 'line',
            data: {
                labels: bufferSizes,
                datasets: [{
                    label: 'Baseline F1 Score',
                    data: baselineF1,
                    borderColor: 'rgb(255, 99, 132)',
                    backgroundColor: 'rgba(255, 99, 132, 0.2)',
                }, {
                    label: 'System F1 Score',
                    data: systemF1,
                    borderColor: 'rgb(75, 192, 192)',
                    backgroundColor: 'rgba(75, 192, 192, 0.2)',
                }]
            },
            options: {
                ...chartOptions,
                plugins: {
                    ...chartOptions.plugins,
                    title: { display: true, text: 'F1 Score vs Buffer Size (%)' }
                }
            }
        });
        
        new Chart(document.getElementById('pollutionChart'), {
            type: 'line',
            data: {
                labels: bufferSizes,
                datasets: [{
                    label: 'Baseline Pollution Rate',
                    data: baselinePollution,
                    borderColor: 'rgb(255, 99, 132)',
                    backgroundColor: 'rgba(255, 99, 132, 0.2)',
                }, {
                    label: 'System Pollution Rate',
                    data: systemPollution,
                    borderColor: 'rgb(75, 192, 192)',
                    backgroundColor: 'rgba(75, 192, 192, 0.2)',
                }]
            },
            options: {
                ...chartOptions,
                plugins: {
                    ...chartOptions.plugins,
                    title: { display: true, text: 'Pollution Rate vs Buffer Size (%) - Lower is Better' }
                }
            }
        });
        
        // Recall Probe Charts (only if data available)
        const baselineRouge1 = [0.24482456532438165, 0.23692439378340088, 0.18106633455028237];
        const systemRouge1 = [0.4239521408787627, 0.40940583576261447, 0.4055902217359701];
        const baselineRougeL = [0.12697509184403, 0.13491080760084806, 0.10160811102239034];
        const systemRougeL = [0.30041231657202333, 0.30967228371220107, 0.3194007921785538];
        const baselineBleu = [0.03643997389350511, 0.032406816208173476, 0.020470741562820288];
        const systemBleu = [0.1581082589780311, 0.12587097261113717, 0.13249801307965092];
        
        if (baselineRouge1.some(v => v > 0) || systemRouge1.some(v => v > 0)) {
            new Chart(document.getElementById('rouge1Chart'), {
                type: 'line',
                data: {
                    labels: bufferSizes,
                    datasets: [{
                        label: 'Baseline ROUGE-1',
                        data: baselineRouge1,
                        borderColor: 'rgb(255, 99, 132)',
                        backgroundColor: 'rgba(255, 99, 132, 0.2)',
                    }, {
                        label: 'System ROUGE-1',
                        data: systemRouge1,
                        borderColor: 'rgb(75, 192, 192)',
                        backgroundColor: 'rgba(75, 192, 192, 0.2)',
                    }]
                },
                options: {
                    ...chartOptions,
                    plugins: {
                        ...chartOptions.plugins,
                        title: { display: true, text: 'ROUGE-1 (F1) vs Buffer Size - Higher is Better' }
                    }
                }
            });
            
            new Chart(document.getElementById('rougeLChart'), {
                type: 'line',
                data: {
                    labels: bufferSizes,
                    datasets: [{
                        label: 'Baseline ROUGE-L',
                        data: baselineRougeL,
                        borderColor: 'rgb(255, 99, 132)',
                        backgroundColor: 'rgba(255, 99, 132, 0.2)',
                    }, {
                        label: 'System ROUGE-L',
                        data: systemRougeL,
                        borderColor: 'rgb(75, 192, 192)',
                        backgroundColor: 'rgba(75, 192, 192, 0.2)',
                    }]
                },
                options: {
                    ...chartOptions,
                    plugins: {
                        ...chartOptions.plugins,
                        title: { display: true, text: 'ROUGE-L (F1) vs Buffer Size - Higher is Better' }
                    }
                }
            });
            
            new Chart(document.getElementById('bleuChart'), {
                type: 'line',
                data: {
                    labels: bufferSizes,
                    datasets: [{
                        label: 'Baseline BLEU-2',
                        data: baselineBleu,
                        borderColor: 'rgb(255, 99, 132)',
                        backgroundColor: 'rgba(255, 99, 132, 0.2)',
                    }, {
                        label: 'System BLEU-2',
                        data: systemBleu,
                        borderColor: 'rgb(75, 192, 192)',
                        backgroundColor: 'rgba(75, 192, 192, 0.2)',
                    }]
                },
                options: {
                    ...chartOptions,
                    plugins: {
                        ...chartOptions.plugins,
                        title: { display: true, text: 'BLEU-2 Score vs Buffer Size - Higher is Better' }
                    }
                }
            });
        }
    </script>
</body>
</html>
