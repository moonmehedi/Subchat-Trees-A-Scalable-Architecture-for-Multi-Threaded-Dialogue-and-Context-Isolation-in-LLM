<svg xmlns="http://www.w3.org/2000/svg" width="920" height="1320" viewBox="0 0 920 1320" font-family="'Georgia', 'Times New Roman', serif">
  <defs>
    <!-- Arrow markers — orient="auto" so head always points along line direction -->
    <marker id="arr" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="10" markerHeight="7" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#444"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="10" markerHeight="7" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2a6496"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="10" markerHeight="7" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6a4c93"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="10" markerHeight="7" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3a8a3a"/>
    </marker>
    <marker id="arr-gray" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="10" markerHeight="7" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#999"/>
    </marker>

    <linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f9f9fb"/>
      <stop offset="100%" stop-color="#eef1f6"/>
    </linearGradient>
    <linearGradient id="embedGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff5e6"/>
      <stop offset="100%" stop-color="#ffe8c0"/>
    </linearGradient>
    <linearGradient id="chromaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f0fe"/>
      <stop offset="100%" stop-color="#c8daf8"/>
    </linearGradient>
    <linearGradient id="turnGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3f0fa"/>
      <stop offset="100%" stop-color="#e0d8f0"/>
    </linearGradient>
    <linearGradient id="blockGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8fae8"/>
      <stop offset="100%" stop-color="#c8e8c8"/>
    </linearGradient>
  </defs>

  <rect width="920" height="1320" fill="white"/>

  <!-- ================================================================ -->
  <!-- PHASE 1: QUERY DECOMPOSITION                                      -->
  <!-- ================================================================ -->
  <text x="460" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#222" text-decoration="underline">Phase 1 — Multi-Query Decomposition</text>

  <!-- User Query -->
  <rect x="250" y="48" width="420" height="56" rx="8" fill="url(#sg)" stroke="#555" stroke-width="1.8"/>
  <text x="290" y="74" font-size="15" font-weight="bold" fill="#222">User Query  q</text>
  <text x="290" y="94" font-size="13" fill="#666" font-style="italic">"What languages have we discussed?"</text>

  <!-- Arrow: User Query → LLM Generator -->
  <line x1="460" y1="104" x2="460" y2="136" stroke="#444" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- LLM Sub-query Generator -->
  <rect x="180" y="140" width="560" height="86" rx="8" fill="#fef3e8" stroke="#c87830" stroke-width="1.8"/>
  <text x="220" y="168" font-size="15" font-weight="bold" fill="#8a4c10">LLM Sub-Query Generator</text>
  <text x="220" y="192" font-size="13" fill="#555">Groq API  |  Temperature = 0.3  |  Intent-specific prompts</text>
  <text x="220" y="214" font-size="14" fill="#333" font-style="italic">Output:  Q = { q₀ (original),  q₁,  q₂,  …,  qₙ₋₁ }     n ≤ 8</text>

  <!-- Fan-out arrows from generator to sub-query boxes -->
  <line x1="290" y1="226" x2="120" y2="278" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="370" y1="226" x2="280" y2="278" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="460" y1="226" x2="460" y2="278" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="550" y1="226" x2="640" y2="278" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="630" y1="226" x2="800" y2="278" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Sub-query boxes -->
  <rect x="52" y="282" width="136" height="48" rx="6" fill="url(#sg)" stroke="#777" stroke-width="1.2"/>
  <text x="74" y="304" font-size="13" fill="#222" font-weight="bold">q₀</text>
  <text x="96" y="304" font-size="12" fill="#555">(original)</text>
  <text x="74" y="322" font-size="11" fill="#888" font-style="italic">N = 20 results</text>

  <rect x="212" y="282" width="136" height="48" rx="6" fill="url(#sg)" stroke="#777" stroke-width="1.2"/>
  <text x="234" y="304" font-size="13" fill="#222" font-weight="bold">q₁</text>
  <text x="256" y="304" font-size="12" fill="#555">(reformulation)</text>
  <text x="234" y="322" font-size="11" fill="#888" font-style="italic">N = 20 results</text>

  <rect x="392" y="282" width="136" height="48" rx="6" fill="url(#sg)" stroke="#777" stroke-width="1.2"/>
  <text x="414" y="304" font-size="13" fill="#222" font-weight="bold">q₂</text>
  <text x="414" y="322" font-size="11" fill="#888" font-style="italic">N = 20 results</text>

  <rect x="572" y="282" width="136" height="48" rx="6" fill="url(#sg)" stroke="#777" stroke-width="1.2"/>
  <text x="620" y="308" font-size="16" fill="#555" text-anchor="middle">…</text>

  <rect x="732" y="282" width="136" height="48" rx="6" fill="url(#sg)" stroke="#777" stroke-width="1.2"/>
  <text x="754" y="304" font-size="13" fill="#222" font-weight="bold">qₙ₋₁</text>
  <text x="754" y="322" font-size="11" fill="#888" font-style="italic">N = 20 results</text>

  <text x="460" y="356" text-anchor="middle" font-size="12" fill="#888">Each sub-query dispatched in parallel to the vector store</text>

  <!-- ================================================================ -->
  <!-- PHASE 2: EMBEDDING + VECTOR SEARCH                                -->
  <!-- ================================================================ -->
  <!-- Converge arrows down into embedding model -->
  <line x1="120" y1="330" x2="120" y2="408" stroke="#2a6496" stroke-width="1.3" marker-end="url(#arr-blue)"/>
  <line x1="280" y1="330" x2="280" y2="408" stroke="#2a6496" stroke-width="1.3" marker-end="url(#arr-blue)"/>
  <line x1="460" y1="330" x2="460" y2="408" stroke="#2a6496" stroke-width="1.3" marker-end="url(#arr-blue)"/>
  <line x1="640" y1="330" x2="640" y2="408" stroke="#2a6496" stroke-width="1.3" marker-end="url(#arr-blue)"/>
  <line x1="800" y1="330" x2="800" y2="408" stroke="#2a6496" stroke-width="1.3" marker-end="url(#arr-blue)"/>

  <rect x="285" y="371" width="350" height="24" fill="white"/>
  <text x="460" y="388" text-anchor="middle" font-size="17" font-weight="bold" fill="#222" text-decoration="underline">Phase 2 — Embedding and Vector Search</text>

  <!-- Embedding Model box -->
  <rect x="52" y="410" width="816" height="64" rx="8" fill="url(#embedGrad)" stroke="#c87830" stroke-width="1.8"/>
  <text x="82" y="438" font-size="15" font-weight="bold" fill="#8a4c10">Embedding Model:  all-mpnet-base-v2</text>
  <text x="82" y="462" font-size="13" fill="#555">SentenceTransformers  |  768 dimensions  |  Cosine similarity</text>
  <text x="580" y="438" font-size="14" fill="#8a4c10" font-weight="bold">e(qᵢ) ∈ ℝ⁷⁶⁸</text>
  <text x="580" y="462" font-size="12" fill="#888">Each sub-query embedded independently</text>

  <!-- Arrow: Embedding → ChromaDB -->
  <line x1="460" y1="474" x2="460" y2="504" stroke="#2a6496" stroke-width="1.8" marker-end="url(#arr-blue)"/>

  <!-- ChromaDB box -->
  <rect x="120" y="508" width="680" height="88" rx="8" fill="url(#chromaGrad)" stroke="#2a6496" stroke-width="1.8"/>
  <text x="160" y="536" font-size="15" font-weight="bold" fill="#1a4a70">ChromaDB — Persistent Vector Store</text>
  <text x="160" y="560" font-size="13" fill="#444">Collection:  "conversation_archive"</text>
  <text x="160" y="580" font-size="13" fill="#555">Metadata per message:  node_id, role, timestamp, turn_number τ, title, archived</text>

  <!-- Index path side note -->
  <rect x="6" y="524" width="100" height="48" rx="5" fill="#f0f0f0" stroke="#aaa" stroke-width="1.2"/>
  <text x="18" y="546" font-size="11" fill="#444" font-weight="bold">Index Path</text>
  <text x="18" y="564" font-size="10.5" fill="#777">add_message()</text>
  <line x1="106" y1="548" x2="118" y2="548" stroke="#aaa" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-gray)"/>

  <!-- Arrow: ChromaDB → Deduplication -->
  <line x1="460" y1="596" x2="460" y2="626" stroke="#444" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- ================================================================ -->
  <!-- DEDUPLICATION                                                      -->
  <!-- ================================================================ -->
  <rect x="150" y="630" width="620" height="80" rx="8" fill="url(#sg)" stroke="#555" stroke-width="1.8"/>
  <text x="190" y="658" font-size="15" font-weight="bold" fill="#222">Deduplication</text>
  <text x="190" y="680" font-size="13" fill="#444">Per sub-query:  keep u = 5 unique results  (by text + message ID)</text>
  <text x="190" y="700" font-size="13" fill="#444">Cross-query:  shared seen set filters global duplicates</text>

  <text x="460" y="726" text-anchor="middle" font-size="14" fill="#333" font-style="italic">Result:  𝒫 = ⋃ Rᵢ   (up to n × u ≈ 25 unique anchor messages)</text>

  <!-- ================================================================ -->
  <!-- PHASE 3: RE-RANKING                                                -->
  <!-- ================================================================ -->
  <!-- Arrow: Dedup → Re-rank -->
  <line x1="460" y1="710" x2="460" y2="774" stroke="#444" stroke-width="1.8" marker-end="url(#arr)"/>

  <rect x="340" y="745" width="240" height="24" fill="white"/>
  <text x="460" y="762" text-anchor="middle" font-size="17" font-weight="bold" fill="#222" text-decoration="underline">Phase 3 — Re-Rank Anchors</text>

  <rect x="150" y="778" width="620" height="78" rx="8" fill="url(#sg)" stroke="#555" stroke-width="1.8"/>
  <text x="190" y="806" font-size="15" font-weight="bold" fill="#222">Cosine Re-Ranking Against Original Query q₀</text>
  <text x="190" y="830" font-size="13" fill="#444">Sort all ~25 anchors by  cosine_sim( e(anchor), e(q₀) )  descending</text>
  <text x="190" y="848" font-size="13" fill="#444">Tiebreaker:  most recent timestamp first</text>

  <!-- Arrow: Re-rank → Top-k -->
  <line x1="460" y1="856" x2="460" y2="882" stroke="#444" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- Top-k selection -->
  <rect x="240" y="886" width="440" height="50" rx="8" fill="#e8fae8" stroke="#3a8a3a" stroke-width="1.8"/>
  <text x="290" y="912" font-size="15" font-weight="bold" fill="#2a6a2a">Select Top-k Anchors</text>
  <text x="530" y="912" font-size="14" fill="#444">k ∈ [3, 10],  default k = 5</text>

  <!-- ================================================================ -->
  <!-- PHASE 4: TURN-BASED EXPANSION                                      -->
  <!-- ================================================================ -->
  <!-- Arrow: Top-k → Expansion -->
  <line x1="460" y1="936" x2="460" y2="978" stroke="#6a4c93" stroke-width="1.8" marker-end="url(#arr-purple)"/>

  <rect x="305" y="949" width="310" height="24" fill="white"/>
  <text x="460" y="966" text-anchor="middle" font-size="17" font-weight="bold" fill="#222" text-decoration="underline">Phase 4 — Turn-Based Context Expansion</text>

  <!-- Expansion box -->
  <rect x="100" y="982" width="720" height="74" rx="8" fill="url(#turnGrad)" stroke="#6a4c93" stroke-width="1.8"/>
  <text x="140" y="1010" font-size="15" font-weight="bold" fill="#4a3070">± δ Turn Window Expansion   (δ = 2)</text>
  <text x="140" y="1032" font-size="13" fill="#444">For each anchor at turn τₐ :   W(τₐ) = { m ∈ Mₙ  :  |τ(m) − τₐ| ≤ 2 }  ∩  ¬Buffer</text>
  <text x="140" y="1050" font-size="12" fill="#777">Neighbour messages scored at 0.8× anchor score   |   Dedup across overlapping windows</text>

  <!-- Arrow: Expansion → Blocks -->
  <line x1="460" y1="1056" x2="460" y2="1082" stroke="#3a8a3a" stroke-width="1.8" marker-end="url(#arr-green)"/>

  <!-- Coherent Blocks output -->
  <rect x="80" y="1086" width="760" height="146" rx="8" fill="url(#blockGrad)" stroke="#3a8a3a" stroke-width="1.8"/>
  <text x="120" y="1112" font-size="15" font-weight="bold" fill="#2a6a2a">Output:  Coherent Context Blocks</text>

  <!-- Block 1 -->
  <rect x="100" y="1122" width="340" height="100" rx="5" fill="white" stroke="#bbb" stroke-width="1.2"/>
  <text x="118" y="1142" font-size="13" font-weight="bold" fill="#444">Block 1  (anchor at turn 15)</text>
  <text x="118" y="1160" font-size="12" fill="#777">[turn 13]  User: "What about R?"</text>
  <text x="118" y="1176" font-size="12" fill="#777">[turn 14]  Assistant: "R is popular in…"</text>
  <text x="118" y="1192" font-size="12" fill="#2a6a2a" font-weight="bold">[turn 15]  User: "Python is great…"  ← ANCHOR</text>
  <text x="118" y="1208" font-size="12" fill="#777">[turn 16]  Assistant: "Yes, Python leads…"</text>

  <!-- Block 2 -->
  <rect x="480" y="1122" width="340" height="100" rx="5" fill="white" stroke="#bbb" stroke-width="1.2"/>
  <text x="498" y="1142" font-size="13" font-weight="bold" fill="#444">Block 2  (anchor at turn 42)</text>
  <text x="498" y="1160" font-size="12" fill="#777">[turn 40]  User: "How does Java…"</text>
  <text x="498" y="1176" font-size="12" fill="#777">[turn 41]  Assistant: "Java uses threads…"</text>
  <text x="498" y="1192" font-size="12" fill="#2a6a2a" font-weight="bold">[turn 42]  User: "What about Go?"  ← ANCHOR</text>
  <text x="498" y="1208" font-size="12" fill="#777">[turn 43]  Assistant: "Go uses goroutines…"</text>

  <!-- Arrow: Blocks → Final -->
  <line x1="460" y1="1232" x2="460" y2="1254" stroke="#444" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- Final output -->
  <rect x="200" y="1258" width="520" height="44" rx="8" fill="url(#sg)" stroke="#555" stroke-width="1.8"/>
  <text x="240" y="1284" font-size="14" font-weight="bold" fill="#222">R  =  k coherent blocks  →  injected into LLM prompt</text>

  <!-- ================================================================ -->
  <!-- LEGEND                                                             -->
  <!-- ================================================================ -->
  <!-- omit legend to save space, labels are self-evident -->
</svg>
