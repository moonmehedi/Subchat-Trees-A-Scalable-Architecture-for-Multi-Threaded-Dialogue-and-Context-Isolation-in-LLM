<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="100%" height="100%">
    <defs>
        <!-- Arrowhead markers -->
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#555" />
        </marker>
        <marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#888" />
        </marker>

        <!-- Drop shadow for academic boxes -->
        <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
            <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.08" />
        </filter>

        <!-- Gradients for subtle academic styling -->
        <linearGradient id="grad-tier1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f8fafc" />
            <stop offset="100%" stop-color="#e3f2fd" />
        </linearGradient>
        <linearGradient id="grad-tier2" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fdfaef" />
            <stop offset="100%" stop-color="#f3e5f5" />
        </linearGradient>
        <linearGradient id="grad-tier3" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f6fbf7" />
            <stop offset="100%" stop-color="#e8f5e9" />
        </linearGradient>
        <linearGradient id="grad-assembly" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fffdfa" />
            <stop offset="100%" stop-color="#fff3e0" />
        </linearGradient>
    </defs>

    <style>
        .box { filter: url(#shadow); stroke-width: 1.5; rx: 8; ry: 8; }
        .node-border-1 { stroke: #1976d2; }
        .node-border-2 { stroke: #7b1fa2; }
        .node-border-3 { stroke: #388e3c; }
        .node-border-4 { stroke: #e64a19; }
        
        text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #333; }
        .title { font-size: 18px; font-weight: bold; fill: #111; }
        .subtitle { font-size: 14px; font-weight: bold; fill: #444; }
        .body-text { font-size: 13px; fill: #333; }
        .mono { font-family: "Courier New", Courier, monospace; font-size: 12px; fill: #d32f2f; background: #fff; }
        .math { font-family: "Georgia", serif; font-style: italic; }
        
        .line { stroke: #555; stroke-width: 2.5; fill: none; }
        .line-dashed { stroke: #888; stroke-width: 2; fill: none; stroke-dasharray: 6,4; }
        
        .prompt-block { fill: #fff; stroke: #ccc; stroke-width: 1; rx: 4; ry: 4; }
        .dark-text { fill: #ffffff !important; }
    </style>

    <!-- Canvas Background -->
    <rect width="1200" height="650" fill="#ffffff" />
    <text x="600" y="35" class="title" style="font-size: 24px;" text-anchor="middle">Hierarchical Memory Design &amp; Context Assembly</text>
    <text x="600" y="55" class="body-text" text-anchor="middle" fill="#666">Subchat Trees Architecture (Section 3.1 &amp; 3.2)</text>

    <!-- TIER 1: Local Buffer -->
    <rect x="40" y="90" width="370" height="200" fill="url(#grad-tier1)" class="box node-border-1" />
    <text x="55" y="115" class="title" fill="#0d47a1">Tier 1: Local Buffer</text>
    <text x="55" y="135" class="subtitle" fill="#1976d2">Short-term Memory</text>
    
    <rect x="55" y="150" width="340" height="65" fill="#fff" stroke="#bbdefb" rx="4" />
    <text x="65" y="168" class="mono">B_i = deque(maxlen=C)</text>
    <text x="65" y="188" class="body-text">• Circular queue (default C = 15)</text>
    <text x="65" y="205" class="body-text" fill="#d32f2f">• Evicts oldest via FIFO</text>
    
    <text x="55" y="245" class="body-text">• Local to each isolated subchat node</text>
    <text x="55" y="265" class="body-text">• <tspan class="math">Immediately</tspan> indexes turns to Global Store</text>

    <!-- TIER 2: Rolling Summary -->
    <rect x="460" y="90" width="360" height="200" fill="url(#grad-tier2)" class="box node-border-2" />
    <text x="475" y="115" class="title" fill="#4a148c">Tier 2: Rolling Summary</text>
    <text x="475" y="135" class="subtitle" fill="#7b1fa2">Medium-term Memory</text>

    <text x="475" y="160" class="body-text">• Preserves continuity past buffer horizon</text>
    <text x="475" y="180" class="body-text">• Bounded to 500 tokens (Temp = 0.3)</text>
    
    <rect x="475" y="195" width="330" height="65" fill="#fff" stroke="#e1bee7" rx="4" />
    <text x="485" y="215" class="mono">S_n = LLM(S_{n-1} ⊕ M_{buffer})</text>
    <text x="485" y="235" class="body-text" fill="#d32f2f">• Triggered automatically at C, 2C, 3C...</text>
    <text x="485" y="275" class="body-text" font-style="italic" fill="#555">Provides parent context to child inheritances</text>

    <!-- TIER 3: Global Vector Store -->
    <rect x="40" y="360" width="780" height="240" fill="url(#grad-tier3)" class="box node-border-3" />
    <text x="55" y="390" class="title" fill="#1b5e20">Tier 3: Global Vector Store (RAG Pipeline)</text>
    <text x="55" y="410" class="subtitle" fill="#388e3c">Long-term Archival &amp; Retrieval</text>

    <!-- ChromaDB cylinder shape representation via rect + circles -->
    <rect x="55" y="430" width="240" height="150" fill="#fff" stroke="#c8e6c9" rx="4" />
    <text x="65" y="450" class="subtitle">ChromaDB Storage</text>
    <text x="65" y="475" class="body-text">• Persistent cross-node archival</text>
    <text x="65" y="495" class="body-text">• <tspan class="mono">all-mpnet-base-v2</tspan> (d=768)</text>
    <text x="65" y="515" class="body-text">• Embeds msg text + metadata:</text>
    <text x="75" y="535" class="body-text" fill="#666" font-size="11px">- node_id, turn_num τ, role</text>

    <rect x="310" y="430" width="240" height="150" fill="#fff" stroke="#c8e6c9" rx="4" />
    <text x="320" y="450" class="subtitle">Multi-Query Search</text>
    <text x="320" y="475" class="body-text">• Decompose query to max 8 subs</text>
    <text x="320" y="495" class="body-text">• Cosine sim search (N=20/query)</text>
    <text x="320" y="515" class="body-text">• Dedup pool &amp; re-rank against</text>
    <text x="330" y="535" class="body-text">original query for top-k anchors.</text>

    <rect x="565" y="430" width="240" height="150" fill="#fff" stroke="#c8e6c9" rx="4" />
    <text x="575" y="450" class="subtitle">Turn-based Expansion</text>
    <text x="575" y="475" class="body-text">• Expands anchor msg by turn window:</text>
    <text x="585" y="495" class="mono">W(τ_a) = {m : |τ(m) - τ_a| ≤ 2}</text>
    <text x="575" y="520" class="body-text">• Yields coherent 5-msg conversational</text>
    <text x="585" y="540" class="body-text">blocks, bypassing time limits.</text>

    <!-- RIGHT: Context Assembly -->
    <rect x="880" y="90" width="280" height="510" fill="url(#grad-assembly)" class="box node-border-4" />
    <text x="895" y="120" class="title" fill="#bf360c">Context Assembly</text>
    <text x="895" y="140" class="subtitle" fill="#e64a19">Final LLM Prompt (C / C_follow)</text>
    
    <text x="895" y="165" class="body-text" font-style="italic">Ordered concatenation (||) of:</text>

    <g transform="translate(895, 180)">
        <!-- Stack blocks -->
        <rect x="0" y="0" width="250" height="35" class="prompt-block" />
        <text x="10" y="22" class="body-text">1. Base System Instr (<tspan class="math">S_sys</tspan>)</text>

        <rect x="0" y="45" width="250" height="45" class="prompt-block" stroke="#e64a19" stroke-width="1.5" stroke-dasharray="4,2"/>
        <text x="10" y="63" class="body-text">2. <tspan fill="#d32f2f" font-weight="bold">Follow-up Prompt (F)</tspan></text>
        <text x="10" y="80" class="body-text" font-size="11px" fill="#666">[If Child Subchat Node]</text>

        <rect x="0" y="100" width="250" height="35" class="prompt-block" />
        <text x="10" y="122" class="body-text">3. Rolling Summary (<tspan class="math">S_sum</tspan>)</text>

        <rect x="0" y="145" width="250" height="35" class="prompt-block" />
        <text x="10" y="167" class="body-text">4. Buffer Context (<tspan class="math">B</tspan>)</text>
        
        <rect x="0" y="190" width="250" height="35" class="prompt-block" />
        <text x="10" y="212" class="body-text">5. Retrieved Blocks (<tspan class="math">R</tspan>)</text>

        <rect x="0" y="235" width="250" height="35" fill="#e0f7fa" stroke="#1976d2" stroke-width="1" rx="4" />
        <text x="10" y="257" class="body-text" font-weight="bold" fill="#0d47a1">6. User Query (q_0)</text>
    </g>

    <!-- LLM Generation Block -->
    <rect x="895" y="490" width="250" height="70" fill="#263238" rx="4" />
    <text x="1020" y="520" class="dark-text" font-weight="bold" text-anchor="middle">LLM Generation</text>
    <text x="1020" y="540" class="dark-text" font-size="12px" text-anchor="middle" opacity="0.8">vLLM (Qwen) / Groq APIs</text>

    <!-- ARROWS AND CONNECTIONS -->
    
    <!-- Tier 1 to Tier 2 -->
    <path d="M 410 185 L 450 185" class="line" marker-end="url(#arrow)" />
    <text x="412" y="160" class="body-text" font-size="11px" fill="#666">Trigger @ C</text>

    <!-- Tier 1 to Vector Store -->
    <path d="M 225 290 L 225 350" class="line" marker-end="url(#arrow)" />
    <text x="230" y="325" class="body-text" font-size="11px" fill="#666">Index turn</text>

    <!-- Tier 1 to Assembly (routed nicely below Tier 2) -->
    <!-- Starts right of Tier 1 at y=250, goes down to y=325, across to assembly -->
    <path d="M 410 250 L 435 250 L 435 325 L 860 325 L 860 355 L 875 355" class="line" marker-end="url(#arrow)" />
    
    <!-- Tier 2 to Assembly -->
    <path d="M 820 185 L 845 185 L 845 307 L 875 307" class="line" marker-end="url(#arrow)" />

    <!-- Vector Store to Assembly -->
    <!-- Exits top right of Vector Store, goes into Context Assembly -->
    <path d="M 820 480 L 850 480 L 850 407 L 875 407" class="line" marker-end="url(#arrow)" />

    <!-- Arrows inside Assembly -->
    <path d="M 1020 460 L 1020 480" class="line" marker-end="url(#arrow)" />

</svg>
